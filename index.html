<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry Mart | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="container">

    <div class="left-section">
      <img class="illustration" src="illustration.jpg" alt="Washing machine with laundry basket" />
    </div>

    <div class="right-section">
      <form class="login-form" action="#" method="post">
        <h1 class="form-heading">Hello Again!</h1>
        <p class="form-description">Welcome back! we missed you!</p>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Emailid@site.com" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" required />
          <a href="#" class="forgot-link">Forgot Password</a>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p class="register-text">Not a member? <a href="#">Register Now</a></p>
      </form>
    </div>

  </div>
</body>

</html>
